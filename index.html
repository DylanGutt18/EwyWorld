<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Ewy World</title>
</head>
<body>
    <div class="LogoContainer">

        <img src="images/lua.png" alt="Lua Logo" class="LuaLogo">

        <div class="Frame">
            <img src="images/Ewelyn.png" alt="Ewy Logo" class="EwyLogo">

            <div class="Menu">
                <canvas id="EwyTitle" class="LogoText"></canvas>
                <button id="Start">Jogar</button>
            </div>

            <div id="GameMenu" class="GameMenu" hidden>
                <h2>Ewy World</h2>
                <button id="Iniciar">Iniciar</button>
                <button id="Opcoes">Opções</button>
                <button id="Personagens">Personagens</button>
                <button id="Voltar">Voltar</button>
            </div>
        </div>

    </div>

    <div id="Intro">
        <p id="IntroText">Ewelyn, o mundo precisa de você...</p>
    </div>
    <script src="index.js"></script>
</body>
</html>
